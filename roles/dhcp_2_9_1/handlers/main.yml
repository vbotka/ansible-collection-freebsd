---
# handlers freebsd_dhcp

- name: Enable and start dhcpd
  listen: enable and start dhcpd
  ansible.builtin.service:
    name: "{{ bsd_dhcpd_service }}"
    state: started
    enabled: true
  register: _bsd_dhcpd_started

- name: Disable and stop dhcpd
  listen: disable and stop dhcpd
  ansible.builtin.service:
    name: "{{ bsd_dhcpd_service }}"
    state: stopped
    enabled: false

- name: Start dhcpd
  listen: start dhcpd
  ansible.builtin.service:
    name: "{{ bsd_dhcpd_service }}"
    state: started
  register: _bsd_dhcpd_started

- name: Stop dhcpd
  listen: stop dhcpd
  ansible.builtin.service:
    name: "{{ bsd_dhcpd_service }}"
    state: stopped

- name: Restart dhcpd
  listen: restart dhcpd
  ansible.builtin.service:
    name: "{{ bsd_dhcpd_service }}"
    state: restarted
  when:
    - bsd_dhcpd_enable | bool
    - not (_bsd_dhcpd_started.changed | default(false))

# EOF
