---
# Default repo
pkg_default_repo_template: repo.j2
pkg_default_repo_conf: []

# Repos /usr/local/etc/pkg/repos
pkg_repos_template: repos.j2
pkg_repos_conf: []

# Remove repos not listed in pkg_repos_conf
pkg_repos_conf_clean: false

# UCL configuration by module vbotka.freebsd.ucl
pkg_repos_conf_ucl: []
