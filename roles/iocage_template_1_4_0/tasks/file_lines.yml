- name: "Lines: Configure lines in files."
  ansible.builtin.include_tasks:
    file: fn/file_lines.yml
    apply:
      tags: fit_file_lines
  loop: "{{ fit_templates | dict2items
                          | rejectattr('key', 'in', fit_iocage_templates)
                          | subelements('value.file_lines', skip_missing=true) }}"
  loop_control:
    loop_var: outer_item
    label: "{{ outer_item.0.key }}"
