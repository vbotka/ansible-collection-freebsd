fit_templates:
  ansible-pkg-repo:
    release: 15.1-RELEASE
    pkg_conf: "{{ fit_pkg_conf | dict2items }}"
    pkg:
      - nginx-lite
      - python312
      - python
      - python3
    templates: "{{ fit_file_templates | dict2items }}"
    commands: "{{ fit_commands }}"
    rcconf: "{{ fit_rcconf | dict2items }}"
    properties:
      ip4: disable
      ip6: disable
      ip6_addr: none
      bpf: 1
      dhcp: 1
      vnet: 1
      notes: '"class=pkg-repo alias=ansible_pkg_repo"'

fit_rcconf:
  nginx_enable: "YES"

fit_commands:
  - mkdir -p /usr/local/www/pkgrepo
  - chown www:www /usr/local/www/pkgrepo
  - chmod 755 /usr/local/www/pkgrepo

fit_file_templates:
  /usr/local/etc/nginx:
    - {src: nginx-pkg-repo.conf.j2, dest: nginx.conf}
