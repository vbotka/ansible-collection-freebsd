freebsd_iocage_pool: zroot
freebsd_iocage_pool_mount: /zroot
freebsd_iocage_mount: /zroot/iocage

templates:
  ansible-client:
    release: '15.1-RELEASE'
    properties:
      bpf: 1
      dhcp: 1
      vnet: 1
      notes: "alias=ansible_client"
    dhclient: "{{ act_dhclient | dict2items }}"
    rcconf: "{{ act_rcconf | dict2items }}"
    # pkglist: /tmp/ansible/ansible-client/pkgs.json

# pkg
act_pkg_install: true
act_pkg:
  - python312
  - python
  - python3
  - sudo

# ansible client template defaults
act_user: admin
act_pk: pk_admins.txt
act_sudo: true
act_rcconf:
  sshd_enable: "YES"
act_dhclient:
  dhclient-exit-hooks: |
    case "$reason" in
        "BOUND"|"REBIND"|"REBOOT"|"RENEW")
        echo $new_ip_address > /var/db/dhclient-hook.address.$interface
        ;;
    esac

clones:
  test-151:
    clone_from: ansible-client
    properties:
      notes: "alias=test_151"
  test-152:
    clone_from: ansible-client
    properties:
      notes: "alias=test_152"
  test-153:
    clone_from: ansible-client
    properties:
      notes: "alias=test_153"

# clones default properties
properties:
  bpf: 1
  dhcp: 1
  vnet: 1
  notes: "vmm={{ inventory_hostname }}"
  defaultrouter: 172.16.99.1

start: "{{ clones.keys() }}"
swarms: {}
