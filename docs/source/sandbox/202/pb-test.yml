- name: Connect to the group test.
  hosts: test
  gather_facts: true
    
  tasks:

    - ansible.builtin.command: hostname
      register: out_host
    
    - ansible.builtin.debug:
        msg: |
          hostname: {{ out_host.stdout }}
          host_hostuuid: {{ iocage_properties.host_hostuuid }}
          hostid: {{ iocage_properties.hostid }}
          discovered_interpreter_python: {{ ansible_facts.discovered_interpreter_python }}
          iocage_hooks: {{ iocage_hooks }}

    - ansible.builtin.command: whoami
      register: out_user

    - ansible.builtin.command: whoami
      register: out_root
      become: true
    
    - ansible.builtin.debug:
        msg: >
          {{ out_host.stdout }}
          {{ out_user.stdout }}
          {{ out_root.stdout }}
