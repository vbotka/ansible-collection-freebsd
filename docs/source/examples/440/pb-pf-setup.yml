- name: Create files for pf.
  hosts: localhost
  gather_facts: false

  vars:

    files:
      pf-rdr-ssh.conf:
        template: default.conf.j2
        net: localnet
        if: ext_if
        subnet: 172.16.95
        start: "{{ pf_rdr_ssh_start | d(0) }}"
        stop: "{{ pf_rdr_ssh_stop | d(255) }}"
        port: "{{ pf_rdr_ssh_port | d(2200) }}"

  tasks:

    - name: Create files.
      ansible.builtin.template:
        src: "{{ item.value.template }}"
        dest: "{{ playbook_dir }}/files/{{ item.key }}"
        mode: '0644'
      loop: "{{ files | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
