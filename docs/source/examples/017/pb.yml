- name: Display jails and groups.
  hosts: all

  tasks:

    - debug:
        msg: |
          {{ iocage_properties.host_hostname }} {{ iocage_ip4 }}
          class: {{ iocage_classes }}
          tags: {{ iocage_tags | to_yaml }}

    - debug:
        msg: |
          {% for group in groups %}
          {{ group }}: {{ groups[group] }}
          {% endfor %}
      run_once: true
