fit_templates:
  ansible-nginx:
    release: 15.1-RELEASE
    pkg_conf: "{{ fit_pkg_conf | dict2items }}"
    pkg:
      - nginx-lite
      - python312
      - python
      - python3
    files: "{{ fit_files | dict2items }}"
    properties:
      ip4: disable
      ip6: disable
      ip6_addr: none
      bpf: 1
      dhcp: 1
      vnet: 1
      notes: '"class=nginx alias=ansible_nginx"'

fit_files:
  /usr/local/www/nginx:
    - index.html
