freebsd_iocage_pool: zroot
freebsd_iocage_pool_mount: /zroot
freebsd_iocage_mount: /zroot/iocage

templates:
  ansible-client:
    release: 15.0-RELEASE
    properties:
      bpf: 1
      dhcp: 1
      vnet: 1
    dhclient: "{{ act_dhclient | dict2items }}"
    rcconf: "{{ act_rcconf | dict2items }}"
    pkglist: /tmp/ansible/ansible-client/pkgs.json

# ansible client template defaults
act_user: admin
act_pk: pk_admins.txt
act_sudo: true
act_rcconf:
  sshd_enable: "YES"
act_dhclient: {}

clones:
  test-151:
    clone_from: ansible-client
    properties:
      ip4_addr: 'vnet0|172.16.95.151/24'
  test-152:
    clone_from: ansible-client
    properties:
      ip4_addr: 'vnet0|172.16.95.152/24'
  test-153:
    clone_from: ansible-client
    properties:
      ip4_addr: 'vnet0|172.16.95.153/24'

# clones default properties
properties:
  bpf: 1
  defaultrouter: 172.16.95.1
  notes: "vmm={{ inventory_hostname }}"

start: "{{ clones.keys() }}"
