- name: Create swarms.

  vars:

    _notes_source:
      - "{{ item.value.notes | d('') }}"
      - "{{ item.value.properties.notes | d('') }}"
      - "{{ properties.notes | d('') }}"
      - "vmm={{ inventory_hostname }}"
      - "class={{ item.value.class | d([]) | join(',') }}"
      - "swarm={{ item.key }}"
    _notes: "{{ _notes_source | select | join(' ') }}"

    _properties_source:
      - "{{ properties | d({}) }}"
      - "{{ item.value.properties | d({}) }}"
    _properties_combined: >-
      {{ _properties_source
         | community.general.remove_keys(target=['notes'])
         | select
         | combine(recursive=true) }}
    _properties: >-
      {% for k, v in _properties_combined.items() %}
      {{ k }}={{ v }}
      {% endfor %}
      notes="{{ _notes }}"

    _query: '[?value.swarm==`{{ item.key }}`].key'
    _count: "{{ item.value.count - _tags | dict2items | community.general.json_query(_query) | length }}"

    cmd_create: >
      iocage create
      --short
      --template {{ item.value.template }}
      --count {{ _count }}
      {{ _properties }}

  block:

    - name: Set iocage_jails
      ansible.builtin.import_tasks: pb-iocage-ansible-clients-v2/iocage_jails.yml

    - name: "Debug iocage_jails and _tags debug2={{ debug2 }}"
      when: debug2 | bool
      ansible.builtin.debug:
        msg: |
          iocage_jails:
            {{ iocage_jails | to_nice_yaml(indent=2) | indent(2) }}
          _tags:
            {{ _tags | to_nice_yaml(indent=2) | indent(2) }}

    - name: "Debug cmd_create debug={{ debug }}"
      when: debug | bool
      ansible.builtin.debug:
        msg: "{{ cmd_create }}"
      loop: "{{ swarms | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Create swarms
      when:
        - not dry_run | bool
        - _count | int > 0
      register: out
      ansible.builtin.command:
        cmd: "{{ cmd_create }}"
      loop: "{{ swarms | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: "Debug create swarms debug={{ debug }}"
      when: debug | bool
      ansible.builtin.debug:
        var: out

- name: Start swarms.
  vars:
    _query: '[?value.swarm==`{{ item.key }}`].key'
    _jails: "{{ _tags | dict2items | community.general.json_query(_query) | difference(_started) }}"
    cmd_start: >
      iocage start
      {{ _jails | join(' ') }}

  block:

    - name: Set iocage_jails
      ansible.builtin.import_tasks: pb-iocage-ansible-clients-v2/iocage_jails.yml

    - name: "Debug iocage_jails, _started, and _tags debug2={{ debug2 }}"
      when: debug2 | bool
      ansible.builtin.debug:
        msg: |
          iocage_jails:
            {{ iocage_jails | to_nice_yaml(indent=2) | indent(2) }}
          _started: {{ _started }}
          _tags:
            {{ _tags | to_nice_yaml(indent=2) | indent(2) }}

    - name: "Debug cmd_start debug={{ debug }}"
      when: debug | bool
      ansible.builtin.debug:
        msg: "{{ cmd_start }}"
      loop: "{{ swarms | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Start swarms
      when:
        - not dry_run | bool
        - _jails | length > 0
      register: out
      ansible.builtin.command:
        cmd: "{{ cmd_start }}"
      loop: "{{ swarms | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: "Debug start swarms debug={{ debug }}"
      when: debug | bool
      ansible.builtin.debug:
        var: out
