project:
  log-server-01:
    notes: alias=log_server_01
    vmm: iocage_06
    template: ansible-init
    class: [log-server]
    custom_facts: class.fact.j2
    properties:
      defaultrouter: "{{ project_hosts[inventory_hostname]['defaultrouter'] }}"
      ip4_addr: "vnet0|{{ project_hosts[inventory_hostname]['log_server'] }}/24"
      vnet: 1
      boot: 1
    ai_vars:
      - ai-db-class.yml
      - ai-conf-roles.yml
      - pkg-repo.yml
    ai_vars_templates:
      - project-hosts.yml
  www-01:
    notes: alias=www_01
    vmm: iocage_06
    template: ansible-init
    class: [log-client]
    custom_facts: class.fact.j2
    properties:
      bpf: 1
      dhcp: 1
      vnet: 1
      boot: 1
    ai_vars:
      - ai-db-class.yml
      - ai-conf-roles.yml
      - pkg-repo.yml
    ai_vars_templates:
      - project-hosts.yml
  www-02:
    notes: alias=www_02
    vmm: iocage_06
    template: ansible-init
    class: [log-client]
    custom_facts: class.fact.j2
    properties:
      bpf: 1
      dhcp: 1
      vnet: 1
      boot: 1
    ai_vars:
      - ai-db-class.yml
      - ai-conf-roles.yml
      - pkg-repo.yml
    ai_vars_templates:
      - project-hosts.yml

vmm: "{{ (project | vbotka.freebsd.project).vmm }}"
