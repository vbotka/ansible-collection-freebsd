- name: Display inventory.
  hosts: test
    
  tasks:
    
    - debug:
        msg: |
          inv      name     ansible_host
          ------------------------------
          {% for h in ansible_play_hosts %}
          {{ h }} {{ hostvars[h].iocage_properties.host_hostname }} {{ hostvars[h].ansible_host }}
          {% endfor %}
      run_once: true
