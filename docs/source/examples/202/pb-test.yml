- name: Display inventory.
  hosts: test

  vars:

    _vars:
      - ansible_host

    _properties:
      - host_hostname
      - host_hostuuid
    
  tasks:
    
    - debug:
        msg: |
          inv       name     uuid     ansible_host
          ----------------------------------------
          {% for h in ansible_play_hosts %}
          {{ h }}  {{ _properties | map('extract', hostvars[h]['iocage_properties']) | join(' ') }} {{ _vars | map('extract', hostvars[h]) | join(' ') }}
          {% endfor %}
      run_once: true
    
    - debug:
        msg: |
          inv       name     uuid     iocage_tags
          ----------------------------------------------------------------------
          {% for h in ansible_play_hosts %}
          {{ h }}  {{ _properties | map('extract', hostvars[h]['iocage_properties']) | join(' ') }} {{ hostvars[h].iocage_tags | to_yaml }}
          {%- endfor %}
      run_once: true
