- name: Destroy swarms.
  hosts: iocage
  environment: "{{ iocage_env | d({}) }}"

  tasks:

    - name: Stop and destroy swarms.
      vars:
        my_group: "{{ groups['vmm_' ~ inventory_hostname] | d([]) }}"
        swarm: "swarm_{{ item }}"
        uuids: "{{ groups[swarm] | d([])
                   | intersect(my_group)
                   | map('extract', hostvars, ['iocage_properties', 'host_hostuuid']) }}"
      block:

        - name: Nothing to destroy..
          when: uuids | length == 0
          ansible.builtin.debug:
             msg: "{{ item }}: Nothing to destroy."
          loop: "{{ swarms.keys() | list }}"

        - name: Display commands.
          when:
            - debug | d(false) | bool
            - uuids | length > 0
          ansible.builtin.debug:
             msg: "iocage stop {{ uuids | join(' ') }}"
          loop: "{{ swarms.keys() | list }}"

        - name: Destroy swarms.
          when: not dry_run | d(false) | bool
          block:

            - name: Stop swarms.
              when: uuids | length > 0
              register: out
              ansible.builtin.command: "iocage stop {{ uuids | join(' ') }}"
              loop: "{{ swarms.keys() | list }}"

            - name: Debug stop swarms.
              when:
                - debug | d(false) | bool
                - not dry_run | d(false) | bool
              ansible.builtin.debug:
                var: out

            - name: Destroy swarms.
              when: uuids | length > 0
              register: out
              ansible.builtin.command: "iocage destroy -f {{ uuids | join(' ') }}"
              loop: "{{ swarms.keys() | list }}"

            - name: Debug destroy swarms.
              when: debug | d(false) | bool
              ansible.builtin.debug:
                var: out
