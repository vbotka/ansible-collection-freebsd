- name: Test connection.
  hosts: project_example_020

  vars:

    fmt: "%-10s %-16s"

  tasks:

    - command: hostname
      register: out

    - debug:
        msg: |
          inv        hostname
          -------------------
          {% for h in ansible_play_hosts %}
          {{ fmt | format(h, hostvars[h].out.stdout) }}
          {% endfor %}
      run_once: true
