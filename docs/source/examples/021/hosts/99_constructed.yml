plugin: ansible.builtin.constructed
compose:
  iocage_tags: dict(iocage_properties.notes | regex_findall('(\\w+)=([\\w\\-,]+)'))
  ansible_python_interpreter: "'auto_silent'"
keyed_groups:
  - prefix: vmm
    key: iocage_tags.vmm
  - prefix: project
    key: iocage_tags.project
  - prefix: swarm
    key: iocage_tags.swarm
