- name: Display connection variables.
  hosts: project_example_020

  vars:

    _vars:
      - iocage_jid
      - iocage_ip4
      - ansible_jail_host
      - ansible_jail_name

    fmt: "%-10s %-3s %-9s %-15s %-17s %-6s"

  tasks:

    - debug:
        msg: |
          inv        id  hostuuid  IP4             ansible_jail_host ansible_jail_name
          -----------------------------------------------------------------------------
          {% for h in ansible_play_hosts %}
          {% set v = _vars | map('extract', hostvars[h]) | map('string') %}
          {% set uuid = hostvars[h]['iocage_properties']['host_hostuuid'] | string %}
          {{ fmt | format(h, v[0], uuid, v[1], v[2], v[3]) }}
          {% endfor %}
      run_once: true
