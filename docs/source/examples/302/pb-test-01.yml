- name: Test module vbotka.freebsd.cgetent
  hosts: iocage
    
  tasks:

    - name: Fetch default login class attributes from /etc/login.conf
      vbotka.freebsd.cgetent:
        database: /etc/login.conf
        key: default

    - name: Display result.
      ansible.builtin.debug:
        var: ansible_facts.cgetent.default

    - name: Fetch daemon login class attributes from /etc/login.conf
      vbotka.freebsd.cgetent:
        database: /etc/login.conf
        key: daemon

    - name: Display result.
      ansible.builtin.debug:
        var: ansible_facts.cgetent.daemon

    - name: Fetch lp record from /etc/printcap
      vbotka.freebsd.cgetent:
        database: /etc/printcap
        key: lp
        fail_key: false

    - name: Display result.
      ansible.builtin.debug:
        var: ansible_facts.cgetent.lp

    - name: Fetch all records from /etc/login.conf
      vbotka.freebsd.cgetent:
        database: /etc/login.conf

    - name: Display result.
      ansible.builtin.debug:
        var: ansible_facts.cgetent
