- name: Test the connection plugin jailexec.
  hosts: swarm_sw_01
  gather_facts: false

  vars:

    _vars:
      - ansible_user
      - ansible_jail_host
      - ansible_jail_name
    fmt: "%-10s %-13s %-18s %-13s"

  tasks:

    - debug:
        msg: |
          {{ fmt | format('inv', 'ansible_user', 'ansible_jail_host', 'ansible_jail_name') }}
          -------------------------------------------------------------
          {% for h in ansible_play_hosts %}
          {% set v = _vars | map('extract', hostvars[h]) | map('string') %}
          {{ fmt | format(h, v[0], v[1], v[2]) }}
          {% endfor %}
      run_once: true

    - command: uname -a
      register: out

    - debug:
        var: out.stdout
