- name: Test Log Clients.
  hosts: log_clients

  tasks:

    - name: Read dictionary project_hosts.
      block:

        - name: Read /root/ansible-vars/project-hosts.yml
          register: ai_vars_raw
          ansible.builtin.slurp:
            src: /root/ansible-vars/project-hosts.yml

        - name: Set project_hosts
          ansible.builtin.set_fact:
            ai_vars: "{{ ai_vars_raw.content | b64decode | from_yaml }}"

        - name: Debug.
          when: debug | d(false) | bool
          ansible.builtin.debug:
            var: ai_vars.project_hosts

    - name: Run loggen.
      block:

        - name: Run loggen.
          register: out
          ansible.builtin.command: >-
            loggen -i -S -n 1
            {{ ai_vars.project_hosts.log_server }} 514

        - name: Debug.
          ansible.builtin.debug:
            var: out.stderr

- name: Display the logs.
  hosts: log_servers
    
  tasks:

    - name: Get log files paths.
      register: out
      ansible.builtin.find:
        paths: /var/log/remote
        recurse: true
        patterns: '*.log'

    - name: Get log files.
      register: out
      ansible.builtin.command: "cat {{ item }}"
      loop: "{{ out.files | map(attribute='path') }}"

    - name: Display log files.
      ansible.builtin.debug:
        msg: |
          {{ item.stdout }}

          - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -
      loop: "{{ out.results }}"
      loop_control:
        label: "{{ item.cmd }}"
