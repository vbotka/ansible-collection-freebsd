- name: Iocage datasets.
  import_playbook: pb-iocage-list.yml

- name: Create inventory group test.
  hosts: iocage

  vars:

    jails: "{{ hostvars | json_query('*.iocage_jails') | combine }}"

  tasks:

    - name: Create inventory group test.
      run_once: true
      block:

        - name: Debug.
          when: debug | d(false) | bool
          ansible.builtin.debug:
            var: jails

        - name: Create inventory group test.
          ansible.builtin.add_host:
            groups: test
            name: "{{ item }}"
            ansible_host: "{{ jails[item].ip4 | split('|') | last
                                              | split('/') | first }}"
            jid: "{{ jails[item].jid }}"
            boot: "{{ jails[item].boot }}"
            state: "{{ jails[item].state }}"
            type: "{{ jails[item].type }}"
            release:  "{{ jails[item].release }}"
            ip4: "{{ jails[item].ip4 }}"
            ip6: "{{ jails[item].ip6 }}"
            template: "{{ jails[item].template }}"
            basejail: "{{ jails[item].basejail }}"
          loop: "{{ jails.keys() | select('match', 'test') }}"
  
- name: Use inventory group test.
  hosts: test

  vars:

    _vars: [jid, boot, state, type, release, ip4, template, basejail]
    opts: "{{ ['inv'] + _vars }}"
    fmt: "%-10s %-4s %-5s %-5s %-10s %-16s %-24s %-15s %-8s"

  tasks:

    - name: Debug jails.
      ansible.builtin.debug:
        msg: |
          {{ fmt | format(*opts) }}
          ---------------------------------------------------------------------------------------------------------
          {% for h in ansible_play_hosts %}
          {% set v = _vars | map('extract', hostvars[h]) | map('string') %}
          {{ fmt | format(h, v[0], v[1], v[2], v[3], v[4], v[5], v[6], v[7]) }}
          {% endfor %}
      run_once: true

    - name: Debug groups.
      ansible.builtin.debug:
        msg: |
          groups:
            {{ groups | to_yaml(indent=2) | indent(2) }}
      run_once: true
