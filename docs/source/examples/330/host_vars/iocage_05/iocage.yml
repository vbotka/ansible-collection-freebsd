freebsd_iocage_pool: iocage
freebsd_iocage_pool_mount: /iocage
freebsd_iocage_mount: "{{ freebsd_iocage_pool_mount }}/iocage"

fetch:
  - 14.5-RELEASE

basejails:
  - name: ansible-test
    release: 14.5-RELEASE
    properties:
      ip4_addr: 'vnet0|172.16.95.200/24'

clones:
  - name: test-511
    clone_from: ansible-test
    properties:
      ip4_addr: 'vnet0|172.16.95.211/24'
  - name: test-512
    clone_from: ansible-test
    properties:
      ip4_addr: 'vnet0|172.16.95.212/24'
  - name: test-513
    clone_from: ansible-test
    properties:
      ip4_addr: 'vnet0|172.16.95.213/24'

properties:
  vnet: 1
  defaultrouter: 172.16.95.1
  notes: "vmm={{ inventory_hostname }}"
