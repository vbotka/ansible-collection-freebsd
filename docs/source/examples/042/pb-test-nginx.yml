- name: Test filter ast_to_nginx
  hosts: localhost
  connection: local

  vars:

    nginx_conf:
      worker_processes: ['auto']
      events:
        worker_connections: ['1024']
      http:
        include: ['/etc/nginx/mime.types']
        server:
          listen: ['80']
          server_name: ['example.com', 'www.example.com']
          location /:
            return: ['200', 'Hello from Crossplane!']
      
  tasks:

    - debug:
        msg: |
          {{ nginx_conf | vbotka.freebsd.dict_to_ast
                        | vbotka.freebsd.ast_to_nginx }}
