- name: Start jails in example 018.
  hosts: iocage

  vars:

    my_jails_down: "{{ groups['vmm_' ~ inventory_hostname]
                       | intersect(groups.example_018)
                       | intersect(groups.state_down) }}"
    my_uuid: "{{ my_jails_down
                 | map('extract', hostvars, ['iocage_properties', 'host_hostuuid']) }}"

  tasks:

    - name: Start jails in example 018.
      block:

        - debug:
            msg: "iocage start {{ my_uuid | join(' ') }}"

        - command: "iocage start {{ my_uuid | join(' ') }}"
