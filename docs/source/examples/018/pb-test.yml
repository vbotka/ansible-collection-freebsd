- name: Test jails in example 018.
  hosts: example_018

  vars:

    _vars:
      - iocage_jid
      - iocage_ip4
      - iocage_release
      - iocage_state

    fmt: "%-10s %-3s %-16s %-16s %-6s"

  tasks:

    - debug:
        msg: |
          inv        id  ip               release          state
          ------------------------------------------------------
          {% for h in ansible_play_hosts %}
          {% set v = _vars | map('extract', hostvars[h]) | list %}
          {{ fmt | format(h, v[0]|string, v[1]|string, v[2]|string, v[3]|string) }}
          {% endfor %}
      run_once: true
