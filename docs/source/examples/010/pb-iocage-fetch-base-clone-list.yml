- name: Iocage fetch releases, create basejail, clone and start jails.
  hosts: iocage
  environment: "{{ iocage_env | d({}) }}"

  tasks:

    - name: Fetch releases.
      vbotka.freebsd.iocage:
        release: "{{ item }}"
      loop: "{{ fetch }}"

    - name: Create basejail.
      vbotka.freebsd.iocage:
        state: basejail
        name: "{{ item.key }}"
        release: "{{ item.value.release }}"
        properties: "{{ [properties, item.value.properties] | combine }}"
      loop: "{{ basejails | dict2items }}"
      loop_control:
        label: "{{ item.key }} {{ item.value.release }}"

    - name: Clone from basejail.
      vbotka.freebsd.iocage:
        state: cloned
        clone_from: "{{ item.value.clone_from }}"
        name: "{{ item.key }}"
        properties: "{{ [properties, item.value.properties] | combine }}"
      loop: "{{ clones | dict2items }}"
      loop_control:
        label: "{{ item.key }} {{ item.value.clone_from }}"

    - name: Start clones.
      vbotka.freebsd.iocage:
        state: started
        name: "{{ item }}"
      loop: "{{ start }}"

    - name: Display lists of bases, plugins, templates, and jails.
      debug:
        msg: |-
          {{ ansible_facts.iocage_releases | to_yaml | trim }}
          {{ ansible_facts.iocage_plugins.keys() | to_yaml | trim }}
          {{ ansible_facts.iocage_templates.keys() | to_yaml | trim }}
          {{ ansible_facts.iocage_jails.keys() | to_yaml | trim }}
