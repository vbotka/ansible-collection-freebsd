- name: Create and start project jails.
  hosts: iocage

  tasks:

    - name: Display vars.  # noqa: run-once
      tags: debug
      when: debug | d(false) | bool
      run_once: true
      ansible.builtin.debug:
        msg: |
          project_template: {{ project_template | d('ansible-init') }}
          project_create_iocage_tags: {{ project_create_iocage_tags | d(false) }}

          project:
            {{ project | to_yaml(indent=2) | indent(2) }}
          vmm:
            {{ vmm | to_yaml(indent=2) | indent(2) }}
          class:
            {{ class | to_yaml(indent=2) | indent(2) }}
          groups:
            {{ groups | to_yaml(indent=2) | indent(2) }}

    - name: Create and start jails.
      tags: create
      vars:
        iocage_jails_absent: "{{ vmm[inventory_hostname] | difference(groups.all) }}"
        iocage_jails_created: "{{ out.stdout_lines | d([]) | map('split') | map('first') | list }}"
      block:

        - name: Display iocage_jails_absent
          when: debug | d(false) | bool
          ansible.builtin.debug:
            var: iocage_jails_absent

        - name: All jails already created. End host.
          when: iocage_jails_absent | length == 0
          ansible.builtin.meta: end_host

        - name: Create jails.
          changed_when: false
          register: out
          ansible.builtin.command: >
            iocage create
            --short
            --template {{ project_template | d('ansible-init') }}
            --count {{ iocage_jails_absent | length }}
            {{ (properties | d({})) | dictsort | map('join', '=') | join(' ') }}

        - name: Display iocage_jails_created
          when: debug | d(false) | bool
          ansible.builtin.debug:
            var: iocage_jails_created

        - name: Set notes.
          changed_when: false
          vars:
            alias: "{{ iocage_jails_absent[idx] }}"
            notes: >-
              alias={{ alias }}
              class={{ vmm[inventory_hostname][alias]['class'] | join(',') }}
              vmm={{ inventory_hostname }}
          ansible.builtin.command: >
            iocage set
            notes="{{ notes }}"
            {{ item }}
          loop: "{{ iocage_jails_created }}"
          loop_control:
            index_var: idx
            label: "{{ alias }} {{ notes }}"

        - name: Start created jails.
          changed_when: false
          ansible.builtin.command: >
            iocage start
            {{ iocage_jails_created | join(' ') }}
