- name: "Debug: Display variables."
  ansible.builtin.debug:
    msg: |
      project_template: {{ project_template | d('ansible-init') }}

      project:
        {{ project | to_yaml(indent=2) | indent(2) }}
      properties:
        {{ properties | d({}) | to_nice_yaml(indent=2) | indent(2) }}
      class:
        {{ class | to_yaml(indent=2) | indent(2) }}
