- name: "Create: Create jails."
  changed_when: false
  register: out
  ansible.builtin.command: >
    iocage create
    --short
    --template {{ project_template | d('ansible-init') }}
    --count {{ iocage_jails_absent | length }}

- name: "Create: Set iocage_jails_created"
  ansible.builtin.set_fact:
    iocage_jails_created: "{{ out.stdout_lines | d([])
                                               | map('split')
                                               | map('first')
                                               | list }}"

- name: "Create: Set project_jails_created"
  ansible.builtin.set_fact:
    project_jails_created: "{{ dict(iocage_jails_created | zip(iocage_jails_absent)) }}"

- name: "Create: Display project_jails_created"
  when: debug | d(false) | bool
  ansible.builtin.debug:
    var: project_jails_created
