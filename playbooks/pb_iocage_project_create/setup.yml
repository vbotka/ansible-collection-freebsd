- name: "Setup: Get activated pool."
  register: out_pool
  changed_when: false
  check_mode: false
  ansible.builtin.command: iocage get -p

- name: "Setup: Set iocage_mount and iocage_jails_absent"
  ansible.builtin.set_fact:
    iocage_mount: "/{{ out_pool.stdout }}"
    iocage_jails_absent: "{{ vmm[inventory_hostname] | difference(groups.all) }}"

- name: "Setup: Display variables."
  when: debug | d(false) | bool
  ansible.builtin.debug:
    msg: |
      iocage_mount: {{ iocage_mount }}

      iocage_jails_absent:
        {{ iocage_jails_absent | to_nice_yaml(indent=2) | indent(2) }}
      vmm.{{ inventory_hostname }}:
        {{ vmm[inventory_hostname] | to_yaml(indent=2) | indent(2) }}

- name: "Setup: All jails already created. End host."
  when: iocage_jails_absent | length == 0
  ansible.builtin.meta: end_host
