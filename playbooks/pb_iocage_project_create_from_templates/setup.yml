- name: "Setup: Get activated pool."
  register: out_pool
  changed_when: false
  check_mode: false
  ansible.builtin.command: iocage get -p

- name: "Setup: Display iocage_mount"
  when: debug | d(false) | bool
  ansible.builtin.debug:
    var: iocage_mount
