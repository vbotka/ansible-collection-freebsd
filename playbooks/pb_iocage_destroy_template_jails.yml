- name: Destroy jails created from a particular template.
  hosts: iocage
  environment: "{{ iocage_env | d({}) }}"

  vars:

    debug: false
    vbotka_freebsd_batch: "{{ lookup('ansible.builtin.env', 'VBOTKA_FREEBSD_BATCH') | d(false, true) }}"
    target_template: ""  # Set via -e "target_template=<name>"

    iocage_jails: "{{ out_jails.stdout | vbotka.freebsd.iocage('jails')
                                       | dict2items
                                       | selectattr('value.type', 'eq', 'jail')
                                       | items2dict }}"

    # Only target jails created from target_template
    destroy_jails: "{{ iocage_jails | dict2items
                                    | selectattr('value.template', 'defined')
                                    | selectattr('value.template', 'eq', target_template)
                                    | map(attribute='key')
                                    | list }}"

    # Only stop jails targeted for destruction that are currently up
    running_jails: "{{ iocage_jails | dict2items
                                    | selectattr('key', 'in', destroy_jails)
                                    | selectattr('value.state', 'eq', 'up')
                                    | map(attribute='key')
                                    | list }}"

  tasks:

    - name: End play if target_template is empty.  # noqa: run-once
      tags: always
      when: target_template | length == 0
      run_once: true
      block:

        - name: Display skip notice.
          ansible.builtin.debug:
            msg: "target_template is empty. Nothing to do."

        - name: Exit play cleanly.
          ansible.builtin.meta: end_play

    - name: Not in a batch. Confirm to proceed.  # noqa: run-once
      tags: always
      when:
        - not ansible_check_mode
        - not vbotka_freebsd_batch | bool
      run_once: true
      block:

        - name: Confirm to proceed.
          register: out
          ansible.builtin.pause:
            prompt: >
              Jails created from template '{{ target_template }}' on
              {{ ansible_play_hosts | join(', ') }} will be stopped and destroyed.
              Do you want to proceed? [y/n]

        - name: End play.
          when: out.user_input | lower != 'y'
          ansible.builtin.meta: end_play

    - name: Set iocage_jails
      tags: list_jails
      block:

        - name: "Get iocage list of jails."
          register: out_jails
          changed_when: false
          check_mode: false
          ansible.builtin.command: iocage list --long

        - name: "Debug iocage_jails debug={{ debug }}"
          when: debug | bool
          ansible.builtin.debug:
            msg: |
              target_template: {{ target_template }}
              iocage_jails:
              {{ iocage_jails.keys() | list | to_nice_yaml }}
              running_jails (to stop):
              {{ running_jails | to_nice_yaml }}
              destroy_jails:
              {{ destroy_jails | to_nice_yaml }}

      rescue:

        - name: "Set iocage_jails failed."
          ansible.builtin.debug:
            msg: |
              {{ ansible_failed_task }}
              {{ ansible_failed_result }}

        - name: "End of the host."
          ansible.builtin.meta: end_host

    - name: Stop running jails.
      when: running_jails | length > 0
      tags: stop_jails
      block:

        - name: "Stop running jails created from {{ target_template }}."
          changed_when: true
          ansible.builtin.command: "iocage stop -f {{ running_jails | join(' ') }}"

      rescue:

        - name: "Stop running jails failed."
          ansible.builtin.debug:
            msg: |
              {{ ansible_failed_task }}
              {{ ansible_failed_result }}

        - name: "End of the host."
          ansible.builtin.meta: end_host

    - name: Destroy jails.
      when: destroy_jails | length > 0
      tags: destroy_jails
      block:

        - name: "Destroy jails created from {{ target_template }}."
          changed_when: true
          ansible.builtin.command: "iocage destroy -f {{ destroy_jails | join(' ') }}"

      rescue:

        - name: "Destroy jails failed."
          ansible.builtin.debug:
            msg: |
              {{ ansible_failed_task }}
              {{ ansible_failed_result }}

        - name: "End of the host."
          ansible.builtin.meta: end_host
